name: ci

on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Lint deployment files
        if: always()
        run: |
          # Pinned image: same shellcheck version on CI and locally (the runner's apt version differs).
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.11.0 deploy/vps/*.sh
          docker compose -f deploy/compose.yml --env-file deploy/.env.example config -q

      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          detailed_summary: true
          include_passed: false

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version tag
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push rfid-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/rfid-backend:${{ env.TAG }}
            ghcr.io/${{ env.OWNER_LC }}/rfid-backend:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=rfid-backend
          cache-to: type=gha,mode=max,scope=rfid-backend

      - name: Build and push rfid-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          provenance: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/rfid-web:${{ env.TAG }}
            ghcr.io/${{ env.OWNER_LC }}/rfid-web:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=rfid-web
          cache-to: type=gha,mode=max,scope=rfid-web

      - name: Summary
        run: |
          echo "Published version: \`${TAG}\` (deploy it with the *deploy* workflow)" >> "$GITHUB_STEP_SUMMARY"
