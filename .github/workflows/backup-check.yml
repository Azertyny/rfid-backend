name: backup-check

# Fails when the newest production backup is older than 26 h, so a failing or silently stopped backup is reported
# without logging into the VPS (spec 009, FR-017b). Uses a read-only key on the bucket.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Keep this scheduled workflow enabled
        run: gh workflow enable backup-check.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install rclone
        run: sudo apt-get update -q && sudo apt-get install -y -q rclone

      - name: Check the newest backup
        env:
          RCLONE_CONFIG_BACKUP_TYPE: s3
          RCLONE_CONFIG_BACKUP_PROVIDER: Other
          RCLONE_CONFIG_BACKUP_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_READ_KEY_ID }}
          RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_READ_SECRET }}
          BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          # Names start with a UTC timestamp: vegelink-YYYYMMDDTHHMMSSZ-<version>.dump
          newest=$(rclone lsf --include 'vegelink-*.dump' "backup:$BUCKET" | sort | tail -n 1)
          if [ -z "$newest" ]; then
            echo "::error::no backup found in $BUCKET"
            echo "No backup found in \`$BUCKET\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          stamp=$(echo "$newest" | sed -E 's/^vegelink-([0-9]{8})T([0-9]{2})([0-9]{2})([0-9]{2})Z-.*/\1 \2:\3:\4/')
          age_hours=$(( ($(date -u +%s) - $(date -u -d "$stamp" +%s)) / 3600 ))
          echo "Newest backup: \`$newest\` (${age_hours} h old)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$age_hours" -ge 26 ]; then
            echo "::error::newest backup $newest is ${age_hours} h old (limit 26 h)"
            exit 1
          fi
