<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - RFID</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="config.js"></script>
    <style>body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; }</style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow-sm border-0" style="width: 100%; max-width: 380px;">
        <div class="card-body p-4">
            <h4 class="fw-bold text-primary mb-4 text-center"><i class="fas fa-wifi me-2"></i>RFID</h4>
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="username">Identifiant</label>
                    <input type="text" class="form-control" id="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input type="password" class="form-control" id="password" autocomplete="current-password" required>
                </div>
                <div class="alert alert-danger py-2 small d-none" id="loginError"></div>
                <button type="submit" class="btn btn-primary w-100" id="loginButton">Se connecter</button>
            </form>
        </div>
    </div>

    <script>
        const KNOWN_PAGES = ['index.html', 'reader.html', 'pickers.html', 'readers.html', 'users.html'];
        const DEFAULT_PAGE_BY_ROLE = { OPERATEUR: 'reader.html', ADMINISTRATEUR: 'index.html' };

        // Only follow ?next= to one of our own pages, never to another site.
        function safeNextPage() {
            const next = new URLSearchParams(window.location.search).get('next');
            if (!next) return null;
            const page = next.split('?')[0];
            return KNOWN_PAGES.includes(page) ? next : null;
        }

        function showError(message) {
            const box = document.getElementById('loginError');
            box.textContent = message;
            box.classList.remove('d-none');
        }

        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = document.getElementById('loginButton');
            button.disabled = true;
            try {
                const response = await fetch(`${CONFIG.API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                if (response.ok) {
                    const user = await response.json();
                    window.location.href = safeNextPage() || DEFAULT_PAGE_BY_ROLE[user.role] || 'index.html';
                } else if (response.status === 401) {
                    showError('Identifiant ou mot de passe incorrect');
                } else {
                    showError('Erreur du serveur, réessayez plus tard');
                }
            } catch (e) {
                showError('Erreur réseau');
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
