<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opérateurs - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }</style>
</head>
<body class="d-flex flex-column h-100">

    <!-- MENU DE NAVIGATION HARMONISÉ -->
    <nav class="navbar navbar-expand navbar-dark bg-dark shadow-sm">
        <div class="container-fluid max-w-7xl mx-auto px-4">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-wifi me-2"></i>RFID Admin
            </a>
            <div class="navbar-nav ms-auto gap-2">
                <a href="index.html" class="btn btn-sm btn-outline-light border-0">
                    <i class="fas fa-chart-line me-1"></i>Dashboard
                </a>
                <a href="pickers.html" class="btn btn-sm btn-primary">
                    <i class="fas fa-users me-1"></i>Opérateurs
                </a>
                <a href="readers.html" class="btn btn-sm btn-outline-light border-0">
                    <i class="fas fa-satellite-dish me-1"></i>Lecteurs
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid max-w-7xl mx-auto py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-primary">Liste des Opérateurs</h3>
            <button class="btn btn-success shadow-sm" onclick="openModal()">
                <i class="fas fa-plus me-1"></i> Nouveau Picker
            </button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover table-striped mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Prénom</th>
                            <th>Nom</th>
                            <th>Commentaire</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="pickersTable">
                        <tr><td colspan="4" class="text-center py-4 text-muted">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white d-flex justify-content-between">
                <span class="text-muted small" id="pageInfo">Page 1</span>
                <div>
                    <button class="btn btn-sm btn-outline-secondary" onclick="changePage(-1)" id="btnPrev">Préc.</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="changePage(1)" id="btnNext">Suiv.</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL AJOUT / MODIFICATION -->
    <div class="modal fade" id="pickerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Ajouter un Picker</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="pickerForm">
                        <input type="hidden" id="pickerId">
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label">Prénom</label>
                                <input type="text" class="form-control" id="pickerFirstName" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Nom</label>
                                <input type="text" class="form-control" id="pickerLastName" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Commentaire</label>
                            <textarea class="form-control" id="pickerComment" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" onclick="savePicker()">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL SUPPRESSION (NOUVEAU) -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="fas fa-exclamation-triangle me-2"></i>Confirmer la suppression</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Êtes-vous sûr de vouloir supprimer cet opérateur ?</p>
                    <p class="text-danger small mb-0">Cette action est irréversible et supprimera l'historique associé.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">Supprimer définitivement</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "https://api.apolog.fr/api";
        const API_TOKEN = "176c77ca6757494f9729784263c6022d";
        
        let currentPage = 0;
        let pickerModal, deleteModal;
        let pickerToDeleteId = null; // Stocke l'ID à supprimer

        document.addEventListener('DOMContentLoaded', () => {
            pickerModal = new bootstrap.Modal(document.getElementById('pickerModal'));
            deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
            fetchPickers();
        });

        async function fetchPickers(page = 0) {
            try {
                const response = await fetch(`${API_URL}/pickers?page=${page}&size=10&sort=lastname,asc`, {
                    headers: { 'x-api-token': API_TOKEN }
                });
                if(response.ok) {
                    const data = await response.json();
                    renderTable(data.content || []);
                    updatePagination(data.metadata || {}, page);
                    currentPage = page;
                }
            } catch (e) { console.error(e); }
        }

        function renderTable(pickers) {
            const tbody = document.getElementById('pickersTable');
            tbody.innerHTML = '';
            if(!pickers.length) { tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Aucun opérateur</td></tr>'; return; }
            pickers.forEach(p => {
                const jsonP = JSON.stringify(p).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${p.firstname}</td>
                        <td class="fw-bold text-uppercase">${p.lastname}</td>
                        <td class="text-muted small">${p.comment || ''}</td>
                        <td class="text-end">
                            <button class="btn btn-outline-primary btn-sm me-1" onclick='editPicker(${jsonP})'><i class="fas fa-edit"></i></button>
                            <button class="btn btn-outline-danger btn-sm" onclick="askDeletePicker('${p.id}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function updatePagination(meta, page) {
            document.getElementById('pageInfo').innerText = `Page ${page + 1} / ${meta.totalPages || 1}`;
            document.getElementById('btnPrev').disabled = (page === 0);
            document.getElementById('btnNext').disabled = !meta.hasNext;
        }
        function changePage(delta) { fetchPickers(currentPage + delta); }

        async function savePicker() {
            const id = document.getElementById('pickerId').value;
            const payload = {
                firstname: document.getElementById('pickerFirstName').value,
                lastname: document.getElementById('pickerLastName').value,
                comment: document.getElementById('pickerComment').value
            };
            const url = id ? `${API_URL}/pickers/${id}` : `${API_URL}/pickers`;
            const method = id ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'x-api-token': API_TOKEN },
                    body: JSON.stringify(payload)
                });
                if (response.ok) { pickerModal.hide(); fetchPickers(currentPage); }
                else { alert("Erreur enregistrement"); }
            } catch (e) { alert("Erreur réseau"); }
        }

        // --- GESTION SUPPRESSION ---
        
        // 1. Demande de suppression (Ouvre le modal)
        function askDeletePicker(id) {
            pickerToDeleteId = id;
            deleteModal.show();
        }

        // 2. Confirmation (Appelle l'API)
        async function confirmDelete() {
            if (!pickerToDeleteId) return;
            
            try {
                const response = await fetch(`${API_URL}/pickers/${pickerToDeleteId}`, { 
                    method: 'DELETE', 
                    headers: { 'x-api-token': API_TOKEN } 
                });
                
                if (response.ok) { 
                    deleteModal.hide();
                    fetchPickers(currentPage);
                } else {
                    alert("Erreur lors de la suppression");
                }
            } catch (e) { alert("Erreur réseau"); }
        }

        function openModal() {
            document.getElementById('pickerForm').reset();
            document.getElementById('pickerId').value = '';
            document.getElementById('modalTitle').innerText = "Ajouter un Picker";
            pickerModal.show();
            setTimeout(() => document.getElementById('pickerFirstName').focus(), 500);
        }
        function editPicker(p) {
            document.getElementById('pickerId').value = p.id;
            document.getElementById('pickerFirstName').value = p.firstname;
            document.getElementById('pickerLastName').value = p.lastname;
            document.getElementById('pickerComment').value = p.comment;
            document.getElementById('modalTitle').innerText = "Modifier le Picker";
            pickerModal.show();
        }
    </script>
</body>
</html>
