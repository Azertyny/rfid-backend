<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Contrôle Qualité</title>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <style>
        /* --- GLOBAL --- */
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; background-color: #000; font-family: 'Segoe UI', sans-serif; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- ÉCRAN DE SÉLECTION (SETUP) --- */
        #setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #080808; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .setup-title { font-size: 2rem; margin-bottom: 40px; color: #888; text-transform: uppercase; letter-spacing: 2px; }
        
        #readers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px; width: 80%; max-width: 1000px;
        }

        .reader-btn {
            background: #1a1a1a; border: 2px solid #333; padding: 30px;
            border-radius: 10px; cursor: pointer; text-align: center;
            transition: all 0.2s;
        }
        .reader-btn:active { transform: scale(0.95); background: #333; }
        .reader-btn h3 { margin: 0; font-size: 1.5rem; color: #fff; }
        .reader-btn p { color: #666; margin-top: 10px; font-size: 0.9rem; font-family: monospace; }
        .reader-btn.inactive { opacity: .5; }
        .reader-btn small { display: block; margin-top: 8px; color: #888; }

        /* --- UI PRINCIPALE (MONITORING) --- */
        #main-interface { display: none; height: 100%; flex-direction: column; }

        /* Header */
        header { height: 15vh; background: #121212; border-bottom: 2px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 40px; }
        .header-col { display: flex; flex-direction: column; }
        .label { font-size: 1rem; color: #888; text-transform: uppercase; }
        .value { font-size: 2rem; font-weight: 700; }
        
        /* Convoyeur */
        #conveyor-belt { flex-grow: 1; position: relative; background: #050505; display: flex; align-items: center; padding-left: 180px; overflow: hidden; }
        .rail-guide { position: absolute; top: 50%; left: 0; width: 100%; height: 4px; background: #333; transform: translateY(-50%); z-index: 0; }
        
        /* Scanner */
        .scanner-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 150px; background: #1a1a1a; border-right: 4px solid #444; z-index: 5; display: flex; align-items: center; justify-content: center; }
        .scanner-icon { font-size: 3rem; color: #555; writing-mode: vertical-rl; font-weight: bold; letter-spacing: 10px; }

        /* Caisses */
        #track-area { display: flex; gap: 20px; z-index: 2; padding: 20px; width: 100%; }
        
        .box-container { height: 60vh; width: 280px; min-width: 280px; cursor: pointer; transition: all 0.3s; }
        .box-card { width: 100%; height: 100%; background: #000; border: 6px solid #fff; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Contenu Caisse */
        .main-text { font-size: 1.8rem; font-weight: 800; text-align: center; word-break: break-all; padding: 0 10px; }
        .sub-text { font-size: 0.9rem; color: #666; font-family: monospace; margin: 10px 0; }
        .timestamp { font-size: 1.5rem; color: #aaa; font-family: monospace; }
        .status-icon { font-size: 4rem; margin-bottom: 20px; }

        /* États */
        .defect .box-card { background: #FFD700; border-color: #FFD700; box-shadow: 0 0 40px rgba(255,215,0,0.4); }
        .defect .main-text { color: #000; }
        .defect .sub-text, .defect .timestamp { color: #333; }

        /* Activité de la ligne (spec 012) */
        .activity-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .activity-row { display: flex; align-items: center; gap: 20px; }
        #activity-name { font-size: 2rem; font-weight: 700; }
        #activity-name.none { color: #FFB300; }
        #change-activity { background: #1f6feb; color: #fff; border: none; border-radius: 10px; font-size: 1.4rem; font-weight: 700; padding: 14px 28px; cursor: pointer; }
        #change-activity:active { transform: scale(0.95); }
        .system-status { font-size: 0.9rem; }
        #activity-banner { display: none; background: #FFB300; color: #111; font-size: 1.6rem; font-weight: 700; padding: 14px 40px; text-align: center; }
        #activity-banner small { display: block; font-size: 1.1rem; font-weight: 600; }
        #activity-chooser { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 50; flex-direction: column; align-items: center; justify-content: center; }
        #activity-chooser h2 { font-size: 2rem; color: #aaa; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 30px; }
        #activity-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; width: 80%; max-width: 1100px; }
        .activity-option { background: #1a1a1a; border: 3px solid #333; border-radius: 12px; padding: 36px 20px; font-size: 1.8rem; font-weight: 700; color: #fff; text-align: center; cursor: pointer; }
        .activity-option.current { border-color: #1f6feb; }
        .activity-option.none { color: #FFB300; }
        .activity-option:active { transform: scale(0.95); background: #333; }
        #activity-cancel { margin-top: 30px; background: none; border: 2px solid #555; color: #aaa; border-radius: 10px; font-size: 1.4rem; padding: 14px 40px; cursor: pointer; }
        #activity-error { color: #ff4d4d; font-size: 1.3rem; min-height: 1.6rem; margin-top: 20px; }
        .record-activity { font-size: 1.1rem; color: #ddd; margin-top: 12px; text-align: center; padding: 0 10px; }
        .record-activity.none { color: #777; font-style: italic; }
        .defect .record-activity { color: #333; }

        /* Indicateurs */
        #status-indicator { position: fixed; bottom: 10px; right: 10px; font-size: 0.8rem; opacity: 0.5; }
        .error-state { color: red !important; opacity: 1 !important; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="setup-title">Sélectionnez la ligne</div>
        <div id="readers-grid">
            <div style="color:#666">Chargement des lecteurs...</div>
        </div>
    </div>

    <div id="main-interface">
        <header>
            <div class="header-col">
                <span class="label">Ligne / Lecteur</span>
                <span class="value" id="reader-uid-display">--</span>
            </div>
            
            <div class="activity-col">
                <div class="activity-row" id="activity-zone">
                    <div class="header-col">
                        <span class="label">Activité</span>
                        <span class="value none" id="activity-name">--</span>
                    </div>
                    <button id="change-activity" onclick="openActivityChooser()">Changer</button>
                </div>
                <div class="system-status">
                    <span id="system-dot" style="display:inline-block; width:15px; height:15px; background:gray; border-radius:50%;"></span>
                    <span id="system-text" style="margin-left:5px; opacity:0.7;">CONNEXION...</span>
                </div>
            </div>

            <div class="header-col" style="text-align:right;">
                <span class="label">Heure</span>
                <span class="value" id="clock" style="font-family:'Courier New';">--:--:--</span>
            </div>
        </header>

        <!-- Bandeau tant qu'aucune activité n'est choisie (spec 012, FR-009a) : ne recouvre rien, le convoyeur rétrécit. -->
        <div id="activity-banner">
            <span id="activity-banner-text">Aucune activité en cours</span>
            <small id="activity-banner-detail"></small>
        </div>

        <div id="conveyor-belt">
            <div class="rail-guide"></div>
            <div class="scanner-zone">
                <div class="scanner-icon">SCAN</div>
            </div>
            <div id="track-area"></div>
        </div>
    </div>

    <div id="activity-chooser">
        <h2>Activité en cours</h2>
        <div id="activity-options"></div>
        <div id="activity-error"></div>
        <button id="activity-cancel" onclick="closeActivityChooser()">Annuler</button>
    </div>

    <div id="status-indicator">Initialisation...</div>

    <script>
        // --- ÉTAT ---
        let CURRENT_READER = {
            uid: null
        };
        let currentRecordsHash = "";
        let lineActivity = null;
        let activityInterval = null;
        const ACTIVITY_POLLING_INTERVAL = 5000;

        // --- PHASE 1 : SETUP ---
        
        async function loadReaders() {
            const grid = document.getElementById('readers-grid');
            try {
                // GET /readers
                const res = await apiFetch(`/readers`);
                if(!res.ok) throw new Error("Erreur chargement lecteurs");
                
                const data = await res.json();
                grid.innerHTML = ""; // Vide le chargement

                // Le YAML dit que data.readers est une liste
                if (!data.readers || data.readers.length === 0) {
                    grid.innerHTML = "<div style='color:red'>Aucun lecteur configuré dans l'API</div>";
                    return;
                }

                data.readers.forEach(reader => {
                    const btn = document.createElement('div');
                    btn.className = 'reader-btn';
                    // reader.uid est l'identifiant lisible du lecteur
                    btn.innerHTML = `
                        <h3>${reader.uid}</h3>
                    `;
                    // Un lecteur désactivé reste sélectionnable pour consulter ses dernières lectures.
                    if (reader.active === false) {
                        btn.classList.add('inactive');
                        btn.insertAdjacentHTML('beforeend', '<small>désactivé</small>');
                    }
                    btn.onclick = () => selectReader(reader);
                    grid.appendChild(btn);
                });

            } catch (e) {
                grid.innerHTML = `<div style='color:red'>${e.message}<br>Vérifiez l'URL dans config.js</div>`;
            }
        }

        function selectReader(reader) {
            // Enregistrement de la config
            CURRENT_READER.uid = reader.uid; // L'identifiant (ex: "Reader 1")

            // Mise à jour UI
            document.getElementById('reader-uid-display').innerText = reader.uid;
            
            // Transition
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('main-interface').style.display = 'flex';

            // Lancement du polling
            startApp();
        }

        // --- PHASE 2 : APP RUNTIME ---

        let intervals = [];

        function startApp() {
            // Horloge
            intervals.push(setInterval(() => {
                document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR');
            }, 1000));

            // Premier fetch immédiat
            fetchRecords();
            // Polling régulier
            intervals.push(setInterval(fetchRecords, CONFIG.POLLING_INTERVAL));

            // Activité de la ligne, plus lente que les lectures (spec 012, research R10)
            fetchLineActivity();
            activityInterval = setInterval(fetchLineActivity, ACTIVITY_POLLING_INTERVAL);
            intervals.push(activityInterval);
        }

        function stopApp() {
            intervals.forEach(clearInterval);
            intervals = [];
        }

        async function fetchRecords() {
            if (!CURRENT_READER.uid) return;
            // Kiosk whose reader was disabled: the page was replaced, stop calling the API every 500 ms.
            if (isKioskUnavailable()) {
                stopApp();
                return;
            }

            try {
                // GET /records/readers/{readerId}
                // Attention: le readerId dans l'URL est bien l'UID du lecteur
                const response = await apiFetch(`/records/readers/${encodeURIComponent(CURRENT_READER.uid)}`, { silent: true });
                if (isKioskUnavailable()) {
                    stopApp();
                    return;
                }

                if (!response.ok) throw new Error(`API: ${response.status}`);
                const data = await response.json();

                // Indicateurs Vie
                updateSystemStatus(true);
                
                // Rendu
                if (data.records) renderBoxes(data.records);

            } catch (error) {
                console.error(error);
                updateSystemStatus(false, error.message);
            }
        }

        function renderBoxes(records) {
            const newHash = JSON.stringify(records);
            if (newHash === currentRecordsHash) return;
            currentRecordsHash = newHash;

            const area = document.getElementById('track-area');
            area.innerHTML = ''; 

            records.slice(0, 5).forEach(record => {
                const el = document.createElement('div');
                el.className = `box-container ${!record.isCompliant ? 'defect' : ''}`;
                
                const timeStr = new Date(record.creationDate).toLocaleTimeString('fr-FR');
                const title = record.tagUid || "TAG ???";
                // Affichage propre du pickerId s'il existe
                const subtitle = record.pickerId ? `Cueilleur : ...${record.pickerId.slice(-4)}` : "Non assigné";

                const activity = record.activityName
                    ? `<div class="record-activity">${escapeHtml(record.activityName)}</div>`
                    : '<div class="record-activity none">Sans activité</div>';

                el.innerHTML = `
                    <div class="box-card">
                        <div class="status-icon">${record.isCompliant ? '✅' : '⚠️'}</div>
                        <div class="timestamp">${timeStr}</div>
                        ${activity}
                    </div>
                `;

                // Interaction PATCH
                el.addEventListener('click', () => toggleCompliance(record, el));
                area.appendChild(el);
            });
        }

        async function toggleCompliance(record, element) {
            const newStatus = !record.isCompliant;
            
            // UI Optimiste
            const icon = element.querySelector('.status-icon');
            if (!newStatus) { element.classList.add('defect'); icon.innerText = '⚠️'; }
            else { element.classList.remove('defect'); icon.innerText = '✅'; }

            try {
                // PATCH /records/{recordId}/conformity
                await apiFetch(`/records/${record.id}/conformity`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isCompliant: newStatus })
                });
                fetchRecords(); // Refresh
            } catch (e) {
                alert("Erreur mise à jour");
                // Rollback visuel simple : le prochain fetchRecords corrigera l'état
            }
        }

        // --- ACTIVITÉ DE LA LIGNE (spec 012) ---

        function lineActivityPath() {
            return `/lines/${encodeURIComponent(CURRENT_READER.uid)}/current-activity`;
        }

        async function fetchLineActivity() {
            if (!CURRENT_READER.uid || isKioskUnavailable()) return;
            try {
                const response = await apiFetch(lineActivityPath(), { silent: true });
                if (isKioskUnavailable()) {
                    stopApp();
                    return;
                }
                // Lecteur en mode enregistrement ouvert par un utilisateur connecté : pas d'activité (analyse U1).
                if (response.status === 400) {
                    hideActivity();
                    return;
                }
                if (!response.ok) throw new Error(`API: ${response.status}`);
                renderLineActivity(await response.json());
            } catch (error) {
                console.error(error);
                updateSystemStatus(false, error.message);
            }
        }

        function hideActivity() {
            clearInterval(activityInterval);
            lineActivity = null;
            document.getElementById('activity-zone').style.display = 'none';
            document.getElementById('activity-banner').style.display = 'none';
        }

        function renderLineActivity(data) {
            lineActivity = data;
            const name = document.getElementById('activity-name');
            const button = document.getElementById('change-activity');
            const banner = document.getElementById('activity-banner');
            const hasChoices = data.availableActivities.length > 0;

            if (data.currentActivity) {
                name.innerText = data.currentActivity.name;
                name.classList.remove('none');
                banner.style.display = 'none';
            } else {
                name.innerText = 'Aucune';
                name.classList.add('none');
                const count = data.recordsWithoutActivityToday;
                document.getElementById('activity-banner-text').innerText =
                    `Aucune activité en cours — ${count} lecture${count > 1 ? 's' : ''} sans activité depuis minuit`;
                document.getElementById('activity-banner-detail').innerText = hasChoices
                    ? "Touchez « Changer » pour choisir l'activité de la ligne."
                    : "Aucune activité n'est associée à cette ligne : contactez l'Administrateur.";
                banner.style.display = 'block';
            }
            button.style.display = hasChoices || data.currentActivity ? 'block' : 'none';
        }

        function openActivityChooser() {
            if (!lineActivity) return;
            const currentId = lineActivity.currentActivity ? lineActivity.currentActivity.id : null;
            const options = document.getElementById('activity-options');
            options.innerHTML = '';
            lineActivity.availableActivities.forEach(activity => {
                options.appendChild(activityOption(activity.name, activity.id, activity.id === currentId));
            });
            options.appendChild(activityOption('Aucune activité', null, currentId === null, 'none'));
            document.getElementById('activity-error').innerText = '';
            document.getElementById('activity-chooser').style.display = 'flex';
        }

        function activityOption(label, activityId, current, extraClass = '') {
            const option = document.createElement('div');
            option.className = `activity-option ${current ? 'current' : ''} ${extraClass}`;
            option.innerText = label;
            option.onclick = () => chooseActivity(activityId);
            return option;
        }

        function closeActivityChooser() {
            document.getElementById('activity-chooser').style.display = 'none';
        }

        async function chooseActivity(activityId) {
            try {
                const response = await apiFetch(lineActivityPath(), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ activityId }),
                    silent: true
                });
                if (isKioskUnavailable()) return;
                if (!response.ok) {
                    // Activité désactivée ou retirée entre-temps : on recharge la liste.
                    await fetchLineActivity();
                    openActivityChooser();
                    document.getElementById('activity-error').innerText =
                        "Cette activité n'est plus disponible. Choisissez-en une autre.";
                    return;
                }
                renderLineActivity(await response.json());
                closeActivityChooser();
            } catch (error) {
                console.error(error);
                document.getElementById('activity-error').innerText = "Erreur de liaison, réessayez.";
            }
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function updateSystemStatus(isOk, msg = "") {
            const dot = document.getElementById('system-dot');
            const txt = document.getElementById('system-text');
            const indic = document.getElementById('status-indicator');

            if (isOk) {
                dot.style.background = "limegreen";
                txt.innerText = "SYSTÈME ACTIF";
                indic.className = "";
                indic.innerText = "Synchro OK " + new Date().toLocaleTimeString();
            } else {
                dot.style.background = "red";
                txt.innerText = "ERREUR LIAISON";
                indic.className = "error-state";
                indic.innerText = msg;
            }
        }

        // Démarrage : Charge la liste des lecteurs
        window.onload = async () => {
            // Line kiosk: the reader comes from the launcher, no login and no reader selection (spec 008, FR-005b).
            if (isKioskMode()) {
                selectReader({ uid: kioskReader() });
                return;
            }
            await requireRole('ADMINISTRATEUR', 'OPERATEUR');
            loadReaders();
        };

    </script>
</body>
</html>
