spring:
  application:
    name: rfid-back
  profiles:
    active: dev

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  registration:
    # A tag-registration session without reads or page activity for this long is closed (spec 003).
    session-timeout: 5m
  security:
    bootstrap-admin:
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
