spring:
  application:
    name: rfid-back
  profiles:
    active: dev

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

app:
  registration:
    # A tag-registration session without reads or page activity for this long is closed (spec 003).
    session-timeout: 5m
  scan:
    # A read of a tag by the same reader less than this after the last read of the record that counted it is the same pass, no new record (spec 004, FR-008). 0s disables it.
    duplicate-window: 10s
    # A tag of the same bucket first read by the same reader less than this after a record counted another tag of that bucket is the crate's second tag (spec 004, FR-010). 0s disables it.
    crate-window: 2s
  tags:
    # Tags expected on buckets; any other uid is refused and never stored (spec 010). Changed only by a new version.
    reference-list: classpath:tags/rfid_tag_list.csv
  station:
    # Days and hours of the dashboard statistics are computed in this zone (spec 007, FR-007).
    time-zone: ${APP_STATION_TIME_ZONE:Europe/Paris}
  security:
    bootstrap-admin:
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
