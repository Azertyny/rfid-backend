openapi: 3.0.3
info:
  title: RFID-BACK API
  version: 1.0.0
  description: API de gestion des cueilleurs, tags, activités et conformités

servers:
  - url: http://localhost:8080/api
    description: Serveur local de développement
  - url: https://vegelink.apolog.fr/api
    description: Serveur de production

# Default: a logged-in user session. /tags/scan uses the reader token, /auth/login is public.
security:
  - SessionCookie: []

# -----------------------------------------------------------------------------------------------
# Endpoints section
# -----------------------------------------------------------------------------------------------
paths:
  # -----------------------------------------------------------------------------------------------
  # Reader section
  # -----------------------------------------------------------------------------------------------
  /readers:
    get:
      summary: List all readers
      operationId: listReaders
      tags: [Reader]
      responses:
        "200":
          description: Readers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadersList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      summary: Create a new reader
      operationId: createReader
      tags: [Reader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReader"
      responses:
        "201":
          description: Reader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reader"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/AlreadyExist" }
        "500": { $ref: "#/components/responses/InternalError" }

  /readers/{readerId}:
    parameters:
      - in: path
        name: readerId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Enable or disable a reader, or change its mode
      operationId: updateReader
      tags: [Reader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReader"
      responses:
        "200":
          description: Updated reader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reader"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /readers/{readerId}/token:
    parameters:
      - in: path
        name: readerId
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Generate a new API token for a reader
      description: The previous token is refused on /tags/scan from the next request on.
      operationId: rotateReaderToken
      tags: [Reader]
      responses:
        "200":
          description: Reader with its new apitoken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reader"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -----------------------------------------------------------------------------------------------
  # Picker section
  # -----------------------------------------------------------------------------------------------
  /pickers:
    get:
      summary: List pickers with pagination
      description: |
        Get the sorted and filtered list of pickers with pagination support
      operationId: getPickers
      tags: [Picker]
      parameters:
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageSort"
      responses:
        "200":
          description: Pickers page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickersPage"
        "4XX": { $ref: "#/components/responses/InvalidRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      summary: Create a picker
      description: Create a new picker
      operationId: createPicker
      tags: [Picker]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePicker"
      responses:
        "201":
          description: Created picker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Picker"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409": { $ref: "#/components/responses/AlreadyExist" }
        "500": { $ref: "#/components/responses/InternalError" }

  /pickers/{pickerId}:
    parameters:
      - in: path
        name: pickerId
        required: true
        description: Identifiant du cueilleur
        schema:
          type: string
          format: uuid
    get:
      summary: Get picker detail
      description: Get detailed information about a specific picker
      operationId: getPicker
      tags: [Picker]
      responses:
        "200":
          description: Cueilleur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Picker"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      summary: Update picker
      operationId: updatePicker
      tags: [Picker]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePicker"
      responses:
        "200":
          description: Cueilleur mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Picker"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/AlreadyExist" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      summary: Delete picker
      operationId: deletePicker
      tags: [Picker]
      responses:
        "204":
          description: Cueilleur supprimé
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  # -----------------------------------------------------------------------------------------------
  # Tag section
  # -----------------------------------------------------------------------------------------------
  /tags/buckets/{bucketNumber}:
    post:
      summary: Register tags for a bucket
      description: >
        Add the provided tags to the bucket (created if unknown). Tags already linked to this
        bucket stay linked. Tags linked to another bucket are moved only when moveConfirmed is true;
        otherwise the request is refused with 409 and nothing is saved.
      operationId: registerTagsForBucket
      tags: [Tag]
      parameters:
        - in: path
          name: bucketNumber
          required: true
          description: Bucket number to associate with the provided tags
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTagsRequest"
      responses:
        "200":
          description: Tags registered for the bucket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterTagsResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Some tags belong to another bucket and the move was not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsInOtherBuckets"
        "500": { $ref: "#/components/responses/InternalError" }

  /tags/scan:
    post:
      summary: Scan a tag and report its compliance state
      description: >
        Endpoint called by an RFID reader to report whether a scanned tag is compliant.
        Accessible only with the API token generated during reader registration.
        401 is also returned when the reader is disabled.
        For a reader in ENREGISTREMENT mode, the read is kept for tag registration (or ignored when
        no registration session is open), no record is created, and isCompliant is always true.
        A blank uid is rejected with 400. For a reader in PRODUCTION mode, a scan of the same tag by the same
        reader within app.scan.duplicate-window (10 s by default) of that tag's latest record creates no new
        record: the response carries the existing record and the message "Duplicate read ignored". If that
        repeat reports isCompliant false and the record is compliant, the record becomes non-compliant.
      operationId: scanTag
      tags: [Tag]
      security:
        - ReaderApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanTagRequest"
      responses:
        "200":
          description: |
            Tag scanned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanTagResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  # -----------------------------------------------------------------------------------------------
  # Registration section (tag registration sessions, spec 003)
  # -----------------------------------------------------------------------------------------------
  /tags/registration-sessions:
    post:
      summary: Start a tag registration session on a reader
      description: >
        The reader must be active and in ENREGISTREMENT mode. From now on, its scans are kept as
        temporary reads of this session. One session per reader; it expires after a period
        without activity.
      operationId: startRegistrationSession
      tags: [Registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRegistrationSession"
      responses:
        "201":
          description: Session started, with no read yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationSession"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The reader already has an open session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderBusy"

  /tags/registration-sessions/{sessionId}:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a registration session and the tags read since Start
      description: Only the Administrateur who started the session can read it.
      operationId: getRegistrationSession
      tags: [Registration]
      responses:
        "200":
          description: Session with its reads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationSession"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Cancel a registration session and discard its reads
      operationId: cancelRegistrationSession
      tags: [Registration]
      responses:
        "204": { $ref: "#/components/responses/Deleted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tags/registration-sessions/{sessionId}/save:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Register the session's tags on a bucket and close the session
      description: >
        Same rules as POST /tags/buckets/{bucketNumber}. On 409 nothing is saved and the session
        stays open.
      operationId: saveRegistrationSession
      tags: [Registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveRegistrationSession"
      responses:
        "200":
          description: Tags registered; the session is closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterTagsResponse"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Some tags belong to another bucket and the move was not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagsInOtherBuckets"

  # -----------------------------------------------------------------------------------------------
  # Record section
  # -----------------------------------------------------------------------------------------------
  /records/stats:
    get:
      summary: Scan statistics for the dashboard
      description: >
        Totals of the records created in a period, computed by the server: summary, one row per picker (records
        without a picker form one row with a null pickerId, last) and one entry per hour of day. Days and hours
        are in the station time zone (app.station.time-zone). Conformity is the current value of each record,
        after manual corrections. The picker rows, and the hour entries, each add up to the summary.
        Administrateur and Opérateur.
      operationId: getRecordStats
      tags: [Record]
      parameters:
        - in: query
          name: period
          required: false
          schema:
            $ref: "#/components/schemas/StatsPeriod"
        - in: query
          name: from
          required: false
          description: First day, inclusive. Required with CUSTOM, refused otherwise.
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: false
          description: Last day, inclusive. Required with CUSTOM, refused otherwise. At most 31 days from `from`.
          schema:
            type: string
            format: date
        - in: query
          name: readerId
          required: false
          description: Only the records of this reader.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Statistics of the period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordStats"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /records/readers/{readerId}:
    get:
      summary: List latest records for a reader
      description: >
        Last 10 records of the reader. Opérateur or Administrateur session, or the token of this reader (line kiosk);
        another reader's token gets 403.
      operationId: listLatestRecordsForReader
      tags: [Record]
      security:
        - SessionCookie: []
        - ReaderApiToken: []
      parameters:
        - in: path
          name: readerId
          required: true
          description: Reader uid
          schema:
            type: string
      responses:
        "200":
          description: Latest records list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordsList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /records/{recordId}/conformity:
    patch:
      summary: Update record conformity
      description: >
        Sets the record's compliance to the given value. Opérateur or Administrateur session (with X-XSRF-TOKEN), or
        the token of the record's reader (line kiosk, no CSRF header); another reader's token gets 403 and nothing
        changes. If the value differs from the current one, the change is recorded in the record's compliance history
        with the user or the reader as author, and duplicate scans no longer change the record. If it is the current
        value, nothing is written (idempotent).
      operationId: updateRecordConformity
      tags: [Record]
      security:
        - SessionCookie: []
        - ReaderApiToken: []
      parameters:
        - in: path
          name: recordId
          required: true
          description: Record identifier
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecordConformityRequest"
      responses:
        "204":
          description: Record conformity updated
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /records/{recordId}/conformity-history:
    get:
      summary: List compliance changes of a record
      description: >
        Every manual compliance change of the record, oldest first. The first change's previousIsCompliant is the
        reader's original verdict. Empty list if the record was never changed. Administrateur only.
      operationId: listRecordConformityChanges
      tags: [Record]
      parameters:
        - in: path
          name: recordId
          required: true
          description: Record identifier
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Compliance changes of the record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConformityChangesList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  # -----------------------------------------------------------------------------------------------
  # Bucket section
  # -----------------------------------------------------------------------------------------------
  /buckets:
    get:
      summary: List buckets with their tags and picker
      description: Retrieve all buckets with associated tags and assigned picker, if any.
      operationId: listBuckets
      tags: [Bucket]
      responses:
        "200":
          description: Buckets list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketsList"
        "500": { $ref: "#/components/responses/InternalError" }

  /buckets/{bucketId}:
    parameters:
      - in: path
        name: bucketId
        required: true
        description: Identifiant du seau
        schema:
          type: string
          format: uuid
    get:
      summary: Get bucket detail with picker
      description: Retrieve a bucket with its tags and assigned picker, if any.
      operationId: getBucket
      tags: [Bucket]
      responses:
        "200":
          description: Bucket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketWithTagsAndPicker"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /buckets/{bucketId}/picker:
    parameters:
      - in: path
        name: bucketId
        required: true
        description: Identifiant du seau
        schema:
          type: string
          format: uuid
    put:
      summary: Assign a bucket to a picker
      description: Assign an existing bucket to an existing picker. If the bucket already has a picker, it is replaced (a picker may have several buckets).
      operationId: assignBucketToPicker
      tags: [Bucket]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignBucketToPickerRequest"
      responses:
        "204":
          description: Seau affecte au cueilleur
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      summary: Unassign the picker from a bucket
      operationId: unassignBucketFromPicker
      tags: [Bucket]
      responses:
        "204":
          description: Seau désaffecté (aussi quand il n'avait pas de cueilleur)
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  # -----------------------------------------------------------------------------------------------
  # Auth section
  # -----------------------------------------------------------------------------------------------
  /auth/login:
    post:
      summary: Log in and open a session
      operationId: login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      summary: Log out and invalidate the session
      operationId: logout
      tags: [Auth]
      responses:
        "204":
          description: Logged out
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/me:
    get:
      summary: Current logged-in user
      operationId: getCurrentUser
      tags: [Auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401": { $ref: "#/components/responses/Unauthorized" }

  # -----------------------------------------------------------------------------------------------
  # User section (Administrateur only)
  # -----------------------------------------------------------------------------------------------
  /users:
    get:
      summary: List users
      operationId: listUsers
      tags: [User]
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create a user
      operationId: createUser
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/AlreadyExist" }

  /users/{userId}:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Change role and/or enabled state
      operationId: updateUser
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUser"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Would leave no enabled Administrateur

  /users/{userId}/password:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Reset a user's password
      operationId: resetUserPassword
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPassword"
      responses:
        "204":
          description: Password reset; the user's sessions are closed
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

# ---------------------------------------------------------------------------
# COMMON DEFINITONS
# ---------------------------------------------------------------------------
components:
  # ---------------------------------------------------------------------------
  responses:
    Done:
      description: Retourné lorsque l'action demandée a été réalisée
    Created:
      description: Retourné lorsqu'une nouvelle ressource a été créée
    Modified:
      description: Retourné lorsqu'une ressource a été modifiée
    Deleted:
      description: Retourné lorsqu'une ressource a été supprimée
    AlreadyExist:
      description: Retourné lorsqu'une ressource existe déjà
    Conflict:
      description: Retourné lorsque l'action est impossible car la ressource est encore utilisée
    NotFound:
      description: Retourné lorsqu'une ressource est introuvable
    InvalidRequest:
      description: Requête invalide
    InternalError:
      description: Erreur interne côté serveur
    UnexpectedError:
      description: Retourné lorsqu'une nouvelle ressource a été créée
    Unauthorized:
      description: Jeton API manquant ou invalide, ou utilisateur non connecté
    Forbidden:
      description: Rôle insuffisant

  # ---------------------------------------------------------------------------
  parameters:
    PageNumber:
      name: page
      in: query
      description: Page number to retrieve (0-based)
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      description: Elements per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageSort:
      name: sort
      in: query
      description: |
        Sort order, format `field,direction`.
        Allowed fields: `lastname`, `firstname`, `creationDate`.
        Allowed directions: `asc`, `desc` (case-insensitive).
        Default when missing: `lastname,asc` then `firstname,asc`.
        Any other value returns 400.
      schema:
        type: string
      example: lastname,asc

  # ---------------------------------------------------------------------------
  schemas:
    CreateReader:
      type: object
      properties:
        uid:
          type: string
          description: Reader uid. Trimmed; must not be blank; unique ignoring case.
          example: Reader 1
          maxLength: 50
      required:
        - uid

    ReaderMode:
      type: string
      enum: [PRODUCTION, ENREGISTREMENT]
      description: >
        PRODUCTION: scans create compliance records. ENREGISTREMENT: scans become temporary
        registration reads for the tag-registration page, and no record is created.

    UpdateReader:
      type: object
      description: At least one field must be present.
      properties:
        active:
          type: boolean
        mode:
          $ref: "#/components/schemas/ReaderMode"

    Reader:
      allOf:
        - $ref: "#/components/schemas/CreateReader"
        - type: object
          required:
            - id
            - active
            - mode
          properties:
            id:
              type: string
              format: uuid
            active:
              type: boolean
              description: False when the reader is disabled; its token is then refused on /tags/scan.
            mode:
              $ref: "#/components/schemas/ReaderMode"
            apitoken:
              type: string
              description: API token used by the reader to authenticate requests. Only returned to Administrateurs.
              example: abcd1234efgh5678ijkl9012mnop3456
            creationDate:
              type: string
              format: date-time
              description: Reader creation date
              example: "2024-01-01T12:00:00Z"
            updateDate:
              type: string
              format: date-time
              description: Last update date of the reader
              example: "2024-01-02T12:00:00Z"

    ReadersList:
      type: object
      properties:
        readers:
          type: array
          items:
            $ref: "#/components/schemas/Reader"
      required:
        - readers

    CreatePicker:
      type: object
      properties:
        lastname:
          type: string
          description: Picker last name
          example: Dupont
          maxLength: 50
        firstname:
          type: string
          description: Picker first name
          example: Alice
          maxLength: 50
        comment:
          type: string
          description: Additional comment about the picker
          example: Available only on weekends
          maxLength: 280
      required:
        - lastname
        - firstname

    UpdatePicker:
      allOf:
        - $ref: "#/components/schemas/CreatePicker"

    Picker:
      allOf:
        - $ref: "#/components/schemas/CreatePicker"
        - type: object
          properties:
            id:
              type: string
              format: uuid
              description: Picker unique identifier
            creationDate:
              type: string
              format: date-time
              description: Picker creation date
            bucketNumbers:
              type: array
              description: Numbers of the buckets currently assigned to the picker, ascending; empty when none
              items:
                type: integer
              example: [12, 47]
          required:
            - id
            - creationDate
            - bucketNumbers

    PageMetadata:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
        size:
          type: integer
          description: Page size
        totalElements:
          type: integer
          description: Total number of elements
        totalPages:
          type: integer
          description: Total number of pages
        hasNext:
          type: boolean
          description: Tell if a next page exists
        hasPrevious:
          type: boolean
          description: Tell if a previous page exists
      required:
        - page
        - size
        - totalElements
        - totalPages
        - hasNext
        - hasPrevious

    PickersPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Picker"
        metadata:
          $ref: "#/components/schemas/PageMetadata"
      required:
        - content
        - metadata

    ScanTagRequest:
      type: object
      properties:
        uid:
          type: string
          pattern: '.*\S.*'
          description: Unique identifier of the scanned tag. Must contain at least one non-blank character; surrounding spaces are removed.
          example: E2000017221101891400A23G
        isCompliant:
          type: boolean
          description: Tells whether the scanned tag is compliant
          example: false
      required:
        - uid
        - isCompliant

    ScanTagResponse:
      type: object
      properties:
        uid:
          type: string
          description: Unique identifier of the scanned tag
          example: E2000017221101891400A23G
        isCompliant:
          type: boolean
          description: Tells whether the scanned tag is compliant
          example: false
        processedAt:
          type: string
          format: date-time
          description: Scan processing date and time
          example: "2024-01-15T09:30:00Z"
        message:
          type: string
          description: >
            Processing message. "Duplicate read ignored" when the scan repeated a recent one (no new record);
            registration messages for readers in ENREGISTREMENT mode; absent otherwise.
          example: Duplicate read ignored
      required:
        - uid
        - isCompliant
        - processedAt

    RegisterTagsRequest:
      type: object
      properties:
        uids:
          type: array
          description: Unique IDs of scanned tags. At most 100 per registration; more is refused with 400.
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            example: E2000017221101891400A23G
        moveConfirmed:
          type: boolean
          default: false
          description: >
            Must be true to move tags that currently belong to another bucket.
            Otherwise the request is refused with 409 and nothing is saved.
      required:
        - uids

    RegisterTagsResponse:
      type: object
      properties:
        bucketNumber:
          type: integer
          description: Bucket number associated with the registered tags
          example: 12
        registeredCount:
          type: integer
          description: Number of unique, non-blank tag uids in this request
          example: 4
        totalCount:
          type: integer
          description: Number of tags linked to the bucket after this registration
          example: 6
      required:
        - bucketNumber
        - registeredCount
        - totalCount

    TagInOtherBucket:
      type: object
      properties:
        uid:
          type: string
          example: E2000017221101891400A23G
        bucketNumber:
          type: integer
          example: 7
      required:
        - uid
        - bucketNumber

    TagsInOtherBuckets:
      type: object
      description: 409 body when tags would be moved from another bucket without confirmation
      properties:
        message:
          type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/TagInOtherBucket"
      required:
        - message
        - tags

    StartRegistrationSession:
      type: object
      properties:
        readerId:
          type: string
          format: uuid
      required:
        - readerId

    RegistrationRead:
      type: object
      properties:
        uid:
          type: string
          example: E2000017221101891400A23G
        firstReadAt:
          type: string
          format: date-time
        bucketNumber:
          type: integer
          nullable: true
          description: Bucket the tag currently belongs to, or null if none
      required:
        - uid
        - firstReadAt

    RegistrationSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        readerId:
          type: string
          format: uuid
        readerUid:
          type: string
        startedBy:
          type: string
          description: Username of the Administrateur who started the session
        startedAt:
          type: string
          format: date-time
        reads:
          type: array
          description: Tags read since Start, one entry per tag, oldest first
          items:
            $ref: "#/components/schemas/RegistrationRead"
      required:
        - id
        - readerId
        - readerUid
        - startedBy
        - startedAt
        - reads

    ReaderBusy:
      type: object
      description: >
        409 body when the reader already has an open registration session. startedBy and startedAt are
        absent in the rare case where the reader stayed contended but its session could not be read back.
      properties:
        message:
          type: string
        startedBy:
          type: string
        startedAt:
          type: string
          format: date-time
      required:
        - message

    SaveRegistrationSession:
      type: object
      properties:
        bucketNumber:
          type: integer
          minimum: 1
        moveConfirmed:
          type: boolean
          default: false
      required:
        - bucketNumber

    RecordSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Record unique identifier
        tagUid:
          type: string
          description: Tag UID (business identifier)
          example: E2000017221101891400A23G
        pickerId:
          type: string
          format: uuid
          nullable: true
          description: Picker identifier associated with the record
        isCompliant:
          type: boolean
          description: Indicates whether the record is compliant
          example: true
        creationDate:
          type: string
          format: date-time
          description: Record creation date
          example: "2024-01-15T09:30:00Z"
      required:
        - id
        - tagUid
        - isCompliant
        - creationDate

    RecordsList:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/RecordSummary"
      required:
        - records

    StatsPeriod:
      type: string
      enum: [TODAY, YESTERDAY, LAST_7_DAYS, CUSTOM]
      default: TODAY
      description: LAST_7_DAYS is today and the 6 days before, in the station time zone.

    RecordCounts:
      type: object
      required:
        - total
        - nonCompliant
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        nonCompliant:
          type: integer
          format: int64
          minimum: 0

    PickerStats:
      allOf:
        - $ref: "#/components/schemas/RecordCounts"
        - type: object
          properties:
            pickerId:
              type: string
              format: uuid
              nullable: true
              description: Null for records without a picker
            firstname:
              type: string
              nullable: true
            lastname:
              type: string
              nullable: true

    HourStats:
      allOf:
        - $ref: "#/components/schemas/RecordCounts"
        - type: object
          required:
            - hour
          properties:
            hour:
              type: integer
              minimum: 0
              maximum: 23
              description: Hour of day in the station time zone

    RecordStats:
      type: object
      required:
        - from
        - to
        - timeZone
        - summary
        - pickers
        - hours
      properties:
        from:
          type: string
          format: date
          description: Resolved first day, inclusive
        to:
          type: string
          format: date
          description: Resolved last day, inclusive
        timeZone:
          type: string
          example: Europe/Paris
        readerId:
          type: string
          format: uuid
          nullable: true
        summary:
          $ref: "#/components/schemas/RecordCounts"
        pickers:
          type: array
          description: Pickers with at least one record, by lastname then firstname; the null-picker row last.
          items:
            $ref: "#/components/schemas/PickerStats"
        hours:
          type: array
          description: Always 24 entries, hour 0 to 23, summed over the days of the period.
          items:
            $ref: "#/components/schemas/HourStats"

    UpdateRecordConformityRequest:
      type: object
      properties:
        isCompliant:
          type: boolean
          description: Indicates whether the record is compliant
          example: true
      required:
        - isCompliant

    ConformityChange:
      type: object
      properties:
        previousIsCompliant:
          type: boolean
          description: Compliance before the change
          example: true
        newIsCompliant:
          type: boolean
          description: Compliance after the change
          example: false
        authorType:
          type: string
          enum: [USER, READER]
          description: USER for a logged-in user, READER for a change made at the line kiosk with the reader token
          example: USER
        authorUsername:
          type: string
          description: Username of the user who made the change. Only when authorType is USER.
          example: operateur1
        authorReaderUid:
          type: string
          description: Uid of the reader whose kiosk made the change. Only when authorType is READER.
          example: Ligne 1
        changedAt:
          type: string
          format: date-time
          description: Date of the change
          example: "2024-01-15T09:31:12Z"
      required:
        - previousIsCompliant
        - newIsCompliant
        - authorType
        - changedAt

    ConformityChangesList:
      type: object
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ConformityChange"
      required:
        - changes

    AssignBucketToPickerRequest:
      type: object
      properties:
        pickerId:
          type: string
          format: uuid
          description: Identifiant du cueilleur
      required:
        - pickerId

    BucketWithTags:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Bucket unique identifier
        number:
          type: integer
          description: Bucket number
          example: 12
        creationDate:
          type: string
          format: date-time
          description: Bucket creation date
        tags:
          type: array
          description: Tags associated with this bucket
          items:
            type: string
            example: E2000017221101891400A23G
      required:
        - id
        - number
        - creationDate
        - tags

    BucketWithTagsAndPicker:
      allOf:
        - $ref: "#/components/schemas/BucketWithTags"
        - type: object
          properties:
            picker:
              allOf:
                - $ref: "#/components/schemas/CreatePicker"
              nullable: true
              description: Picker currently assigned to the bucket

    BucketsList:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/BucketWithTagsAndPicker"
      required:
        - buckets

    Role:
      type: string
      enum: [ADMINISTRATEUR, OPERATEUR]

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          format: password
      required:
        - username
        - password

    CurrentUser:
      type: object
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
      required:
        - username
        - role

    CreateUser:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[A-Za-z0-9._-]+$"
        password:
          type: string
          format: password
          minLength: 8
        role:
          $ref: "#/components/schemas/Role"
      required:
        - username
        - password
        - role

    UpdateUser:
      type: object
      description: At least one field must be present.
      properties:
        role:
          $ref: "#/components/schemas/Role"
        enabled:
          type: boolean

    ResetPassword:
      type: object
      properties:
        password:
          type: string
          format: password
          minLength: 8
      required:
        - password

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        enabled:
          type: boolean
        creationDate:
          type: string
          format: date-time
      required:
        - id
        - username
        - role
        - enabled
        - creationDate

    UsersList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
      required:
        - users

  # ---------------------------------------------------------------------------
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Session opened by POST /auth/login. State-changing requests also need the X-XSRF-TOKEN header (value of the XSRF-TOKEN cookie).
    ReaderApiToken:
      type: apiKey
      in: header
      name: x-api-token
      description: >
        API token of a reader. Authenticates the reader device on POST /tags/scan and the line kiosk on
        GET /records/readers/{its uid} and PATCH /records/{id}/conformity for its own records.
